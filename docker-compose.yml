services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: meridian
      POSTGRES_DB: meridian
    ports: ["5432:5432"]
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  mock-billing:
    build: ./apps/mock-billing
    ports: ["4010:4010"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4010/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20
    environment:
      FAILURE_RATE: "0"
      LATENCY_MS: "0"
      WEBHOOK_FAILURE_RATE: "0"
      WEBHOOK_LATENCY_MS: "0"

  api:
    build: ./apps/api
    ports: ["4000:4000"]
    environment:
      DATABASE_URL: postgres://meridian:meridian@postgres:5432/meridian
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret-change-me
      ACCESS_TOKEN_TTL: "900"
      REFRESH_TOKEN_TTL: "604800"
      BILLING_PROVIDER_URL: http://mock-billing:4010
      API_PORT: "4000"
      WEBHOOK_ALLOWED_HOSTS: mock-billing
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 40

  web:
    build: ./apps/web
    ports: ["3000:3000"]
    environment:
      API_INTERNAL_URL: http://api:4000
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 40

  # Test runner (not started by `docker compose up`):
  #   docker compose --profile test run --rm tests
  tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: tests.Dockerfile
    environment:
      CI: ${CI:-}
      DATABASE_URL: postgres://meridian:meridian@postgres:5432/meridian
      REDIS_URL: redis://redis:6379
      JWT_SECRET: test-secret
      BILLING_PROVIDER_URL: http://mock-billing:4010
      WEBHOOK_ALLOWED_HOSTS: mock-billing
      E2E_BASE_URL: http://web:3000
    volumes:
      - ./reports:/repo/reports
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      mock-billing: { condition: service_healthy }
      web: { condition: service_healthy }
