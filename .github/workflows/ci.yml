name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  test:
    name: Full suite (unit, integration, API, E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Exactly the documented local path: `docker compose up` + one command.
      - name: Start the stack
        run: |
          mkdir -p reports
          set -o pipefail
          BUILDKIT_PROGRESS=plain docker compose up -d --build --wait 2>&1 | tee reports/compose-up.log

      - name: Run the suite
        run: docker compose --profile test run --rm -e CI=true tests

      - name: Job summary
        if: always()
        run: cat reports/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Publish JUnit results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Test results
          path: reports/junit/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: reports/coverage
          if-no-files-found: warn

      - name: Upload machine-readable reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            reports/junit
            reports/summary.json
            reports/e2e-results.json
            reports/playwright-report
          if-no-files-found: warn

      - name: Upload E2E traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: reports/playwright-results
          if-no-files-found: ignore

      - name: Service logs
        if: failure()
        run: |
          docker compose ps -a > reports/compose-ps.log 2>&1 || true
          docker compose logs --no-color --tail 80 > reports/compose.log 2>&1 || true
          # Surface the tail of each log as an annotation so failures are readable from the API/UI
          for f in reports/compose-up.log reports/compose-ps.log reports/compose.log; do
            [ -f "$f" ] || continue
            body=$( { grep -iE "error|failed|exit code|unhealthy|cannot|not found" "$f" | tail -40; echo '--- tail ---'; tail -25 "$f"; } \
                    | tr -d '\r' | cut -c1-300 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=$(basename $f)::${body}"
          done

      - name: Tear down
        if: always()
        run: docker compose down -v
